<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Biblioteca Ads Pro · Configuración</title>
  <link rel="icon" href="../../icons/icon32.png">
  <link rel="stylesheet" href="../shared/ui.css">
  <style>
    html, body { margin: 0; background: var(--bg); }
    main { max-width: 620px; margin: 40px auto; padding: 0 16px; }
    .box { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 22px; box-shadow: var(--shadow-sm); }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 18px; font-size: 13.5px; }
    .ok { color: var(--green); font-weight: 600; font-size: 13px; }
  </style>
</head>
<body class="bap">
  <main>
    <h1>Biblioteca Ads Pro</h1>
    <p class="sub">Configuración de la transcripción de videos.</p>
    <div class="box" id="box"></div>
    <p class="ok" id="ok" hidden>Guardado.</p>
  </main>
  <script src="../shared/core.js"></script>
  <script src="../shared/settings.js"></script>
  <script src="options.js"></script>
</body>
</html>
