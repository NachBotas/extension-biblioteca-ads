<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Biblioteca Ads Pro</title>
  <link rel="stylesheet" href="../shared/ui.css">
  <style>
    html, body { margin: 0; background: var(--surface); }
    body { width: 300px; padding: 16px; }
    .head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .logo { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(135deg, #8b7cf8, #5b4be8); color: #fff; display: flex; align-items: center; justify-content: center; }
    .t { font-weight: 800; font-size: 15px; }
    .s { font-size: 12px; color: var(--muted); }
    .stack { display: flex; flex-direction: column; gap: 8px; }
    .stat { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface-2); font-size: 13px; }
    .stat b { font-size: 18px; }
    .tip { font-size: 12px; color: var(--muted); margin-top: 12px; line-height: 1.45; }
  </style>
</head>
<body class="bap">
  <div class="head">
    <div class="logo" id="logo"></div>
    <div><div class="t">Biblioteca Ads Pro</div><div class="s">Herramientas para la Biblioteca de anuncios</div></div>
  </div>
  <div class="stack">
    <div class="stat"><span>Anuncios guardados</span><b id="n">0</b></div>
    <button class="btn btn-primary btn-lg btn-block" id="panel"></button>
    <button class="btn btn-lg btn-block" id="saved"></button>
    <button class="btn btn-block" id="lib"></button>
  </div>
  <p class="tip">En la Biblioteca de anuncios aparece un botón violeta abajo a la derecha: abre el panel con filtros por destino (perfil, mensaje, web), días activo, descargas y exportación a Excel.</p>
  <script src="../shared/core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
